<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gestione attività: vetro blu con triangolo a tre segmenti. Solo gradienti e opacità (compatibile con QtSvg). -->
  <defs>
    <linearGradient id="body" x1="0" y1="40" x2="0" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d5aa6"/>
      <stop offset="0.45" stop-color="#0f3a78"/>
      <stop offset="1" stop-color="#071f45"/>
    </linearGradient>
    <radialGradient id="depth" cx="256" cy="300" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a8cff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#1450a8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#061a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.5" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#1b6be6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="44" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="380" x2="0" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fb4ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5fb4ff" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="282" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fd0ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3fd0ff" stop-opacity="0"/>
    </radialGradient>
    <!-- segmenti: blu profondo, ciano, azzurro chiaro -->
    <linearGradient id="segL" x1="116" y1="250" x2="300" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="0.55" stop-color="#1d63ee"/>
      <stop offset="1" stop-color="#1550d6"/>
    </linearGradient>
    <linearGradient id="segT" x1="170" y1="120" x2="350" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8ecff"/>
      <stop offset="0.5" stop-color="#6fdcff"/>
      <stop offset="1" stop-color="#1fc4ea"/>
    </linearGradient>
    <linearGradient id="segR" x1="256" y1="240" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6f6ff"/>
      <stop offset="1" stop-color="#93cff6"/>
    </linearGradient>
  </defs>

  <!-- corpo di vetro -->
  <rect x="40" y="40" width="432" height="432" rx="106" fill="url(#body)"/>
  <rect x="40" y="40" width="432" height="432" rx="106" fill="url(#depth)"/>
  <path d="M40 380 H472 V366 C472 424 424 472 366 472 H146 C88 472 40 424 40 366 Z" fill="url(#foot)"/>
  <!-- riflesso superiore con bordo curvo -->
  <path d="M146 46 H366 C421 46 466 91 466 146 V178 C380 150 300 212 196 214 C130 216 84 196 46 176 V146 C46 91 91 46 146 46 Z" fill="url(#gloss)"/>
  <!-- bordo luminoso -->
  <rect x="42.5" y="42.5" width="427" height="427" rx="103.5" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <rect x="49" y="49" width="414" height="414" rx="97" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- bagliore dietro il simbolo -->
  <circle cx="256" cy="282" r="150" fill="url(#glow)"/>

  <g transform="translate(30.7 32) scale(0.88)">
  <!-- segmento in basso a sinistra -->
  <polyline points="186,250 116,372 290,372" fill="none" stroke="#0b2d5e" stroke-opacity="0.92" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="186,250 116,372 290,372" fill="none" stroke="url(#segL)" stroke-opacity="1" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="181,243 111,365 285,365" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- segmento superiore -->
  <polyline points="169,279 256,128 343,279" fill="none" stroke="#0b2d5e" stroke-opacity="0.92" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="169,279 256,128 343,279" fill="none" stroke="url(#segT)" stroke-opacity="1" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="164,272 251,121 338,272" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- segmento in basso a destra -->
  <polyline points="256,372 396,372 326,250" fill="none" stroke="#0b2d5e" stroke-opacity="0.92" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="256,372 396,372 326,250" fill="none" stroke="url(#segR)" stroke-opacity="0.94" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="251,365 391,365 321,243" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
