<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset="0.55" stop-color="#121a24"/>
      <stop offset="1" stop-color="#090d13"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.20" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.70"/>
      <stop offset="0.45" stop-color="#0ea5e9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.88" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.62" cy="1.0" r="0.62">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0d9488" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rimOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.60"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="line" x1="52" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.38" stop-color="#60a5fa"/>
      <stop offset="0.72" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="110" x2="0" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="8" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- ombra esterna morbida -->
  <rect x="14" y="18" width="228" height="234" rx="60" fill="#000000" opacity="0.10"/>
  <rect x="11" y="14" width="234" height="236" rx="60" fill="#000000" opacity="0.12"/>

  <!-- squircle: fondo e luci colorate -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glowCyan)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glowViolet)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glowPink)"/>

  <!-- pannello di vetro (finestra) -->
  <rect x="35" y="81" width="192" height="146" rx="28" fill="#000000" opacity="0.20"/>
  <rect x="32" y="74" width="192" height="146" rx="28" fill="url(#glass)"/>
  <path d="M32 104 V102 A28 28 0 0 1 60 74 H196 A28 28 0 0 1 224 102 V104 Z" fill="#ffffff" opacity="0.07"/>
  <circle cx="56" cy="89" r="5" fill="#ff5f57"/>
  <circle cx="72" cy="89" r="5" fill="#febc2e"/>
  <circle cx="88" cy="89" r="5" fill="#28c840"/>
  <path d="M32 140 H224 M32 172 H224 M80 104 V220 M128 104 V220 M176 104 V220" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" fill="none"/>
  <path d="M52 176 H82 L98 146 L118 194 L140 112 L158 162 L172 150 H206 V206 H52 Z" fill="url(#area)"/>
  <path d="M52 176 H82 L98 146 L118 194 L140 112 L158 162 L172 150 H206" fill="none" stroke="url(#line)" stroke-opacity="0.16" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 176 H82 L98 146 L118 194 L140 112 L158 162 L172 150 H206" fill="none" stroke="url(#line)" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 176 H82 L98 146 L118 194 L140 112 L158 162 L172 150 H206" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140" cy="112" r="10" fill="#38bdf8" opacity="0.35"/>
  <circle cx="140" cy="112" r="5.5" fill="#ffffff"/>
  <rect x="33" y="75" width="190" height="144" rx="27" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- anello indicatore che galleggia sopra il pannello -->
  <circle cx="191" cy="75" r="38" fill="#000000" opacity="0.22"/>
  <circle cx="188" cy="70" r="36" fill="url(#disc)"/>
  <circle cx="188" cy="70" r="35" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="188" cy="70" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="7"/>
  <circle cx="188" cy="70" r="22" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="98 200" transform="rotate(-90 188 70)"/>
  <circle cx="188" cy="70" r="5" fill="#ffffff" opacity="0.9"/>

  <!-- riflesso speculare (sagomato sulla parte alta dello squircle) e ombra interna -->
  <path d="M8 66 A58 58 0 0 1 66 8 H190 A58 58 0 0 1 248 66 V96 C196 82 118 84 8 118 Z" fill="url(#spec)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shade)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="url(#rimOuter)" stroke-width="2"/>
</svg>
